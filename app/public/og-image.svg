<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f45500" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="630" fill="#f45500"/>

  <!-- Brand badge -->
  <rect x="60" y="60" width="200" height="32" rx="16" fill="#f45500" fill-opacity="0.15" stroke="#f45500" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="82" cy="76" r="5" fill="#f45500">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="96" y="81" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#f27e40" letter-spacing="1.5">RIGGING CALCULATORS</text>

  <!-- Main headline -->
  <text x="60" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-2">Free Rigging</text>
  <text x="60" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#f45500" letter-spacing="-2">Calculators</text>
  <text x="60" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="500" fill="#9d9d9d" letter-spacing="-0.5">For Riggers &amp; Site Engineers</text>

  <!-- Tool pills -->
  <g transform="translate(60, 390)">
    <!-- Shackle -->
    <rect x="0" y="0" width="200" height="44" rx="8" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#f45500" font-weight="600">01</text>
    <text x="16" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#d0d0d0" font-weight="500">Shackle Size</text>

    <!-- Sling Angle -->
    <rect x="216" y="0" width="200" height="44" rx="8" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
    <text x="232" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#f45500" font-weight="600">02</text>
    <text x="232" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#d0d0d0" font-weight="500">Sling Angle</text>

    <!-- Wire Rope -->
    <rect x="432" y="0" width="200" height="44" rx="8" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
    <text x="448" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#f45500" font-weight="600">03</text>
    <text x="448" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#d0d0d0" font-weight="500">Wire Rope WLL</text>

    <!-- Crane Load -->
    <rect x="648" y="0" width="200" height="44" rx="8" fill="#161616" stroke="#2a2a2a" stroke-width="1"/>
    <text x="664" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#f45500" font-weight="600">04</text>
    <text x="664" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#d0d0d0" font-weight="500">Crane Load</text>
  </g>

  <!-- Stats row -->
  <g transform="translate(60, 480)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#262626" stroke-width="1"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f45500">4</text>
    <text x="16" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#5c5c5c">Calculators</text>

    <line x1="140" y1="0" x2="140" y2="50" stroke="#262626" stroke-width="1"/>
    <text x="156" y="22" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f45500">4</text>
    <text x="156" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#5c5c5c">Reference Charts</text>

    <line x1="320" y1="0" x2="320" y2="50" stroke="#262626" stroke-width="1"/>
    <text x="336" y="22" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f45500">EN+ZH</text>
    <text x="336" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#5c5c5c">Bilingual</text>
  </g>

  <!-- Domain -->
  <text x="60" y="590" font-family="system-ui, sans-serif" font-size="16" fill="#3a3a3a">riggingcalculators.com</text>

  <!-- Right visual: abstract rigging diagram -->
  <g transform="translate(820, 150)" opacity="0.6">
    <!-- Center load box -->
    <rect x="100" y="300" width="80" height="50" rx="4" fill="#1e1e1e" stroke="#f45500" stroke-width="1.5"/>
    <text x="140" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#f45500" font-weight="600">LOAD</text>

    <!-- Sling lines -->
    <line x1="140" y1="300" x2="60" y2="150" stroke="#f45500" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="140" y1="300" x2="220" y2="150" stroke="#f45500" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>

    <!-- Apex -->
    <circle cx="140" cy="130" r="12" fill="#1e1e1e" stroke="#f45500" stroke-width="2"/>
    <text x="140" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f45500">⊕</text>

    <!-- Apex lines -->
    <line x1="60" y1="150" x2="140" y2="130" stroke="#555" stroke-width="1.5"/>
    <line x1="220" y1="150" x2="140" y2="130" stroke="#555" stroke-width="1.5"/>

    <!-- Angle arc -->
    <path d="M 115 210 A 50 50 0 0 1 165 210" fill="none" stroke="#f45500" stroke-width="1.5" opacity="0.5"/>
    <text x="140" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f45500" opacity="0.8">θ = 60°</text>

    <!-- Shackle dots -->
    <circle cx="60" cy="150" r="7" fill="#1e1e1e" stroke="#9d9d9d" stroke-width="1.5"/>
    <circle cx="220" cy="150" r="7" fill="#1e1e1e" stroke="#9d9d9d" stroke-width="1.5"/>

    <!-- Tension labels -->
    <text x="20" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#9d9d9d" opacity="0.7">T = 5.77 t</text>
    <text x="230" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#9d9d9d" opacity="0.7">T = 5.77 t</text>
  </g>
</svg>
